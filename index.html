<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全屋智能点位工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="点位工作台">
<style>
  :root{
    --bg:#eef1f6; --card:#ffffff; --line:#e3e8ef; --txt:#1f2937; --sub:#6b7280;
    --accent:#2563eb; --danger:#dc2626;
    --c-light:#f59e0b; --c-switch:#3b82f6; --c-socket:#ec4899; --c-sensor:#10b981; --c-other:#8b5cf6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt); font-size:14px; overflow:hidden;
  }
  button{font-family:inherit; cursor:pointer; border:none; background:none; font-size:13px;}
  input,textarea{font-family:inherit; font-size:14px; color:var(--txt); border:1px solid var(--line);
    border-radius:8px; padding:6px 10px; background:#fff; outline:none;}
  input:focus,textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.12);}

  /* ===== 顶栏 ===== */
  .topbar{
    height:58px; background:#fff; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:16px; padding:0 18px;
  }
  .brand{font-size:17px; font-weight:700; white-space:nowrap;}
  .stats{display:flex; gap:8px; flex:1; overflow-x:auto; scrollbar-width:none;}
  .stats::-webkit-scrollbar{display:none;}
  .chip{
    white-space:nowrap; background:#f3f6fb; border:1px solid var(--line);
    border-radius:999px; padding:4px 12px; font-size:12px; color:#374151;
  }
  .chip b{color:var(--accent);}
  .actions{display:flex; gap:8px; white-space:nowrap;}
  .btn{
    padding:7px 14px; border-radius:8px; border:1px solid var(--line);
    background:#fff; color:#374151; transition:.15s;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;}
  .btn.primary:hover{background:#1d4ed8;}
  .btn.ghost-danger{color:var(--danger);}
  .btn.ghost-danger:hover{border-color:var(--danger); color:var(--danger);}

  /* ===== 三栏布局 ===== */
  .layout{display:flex; height:calc(100% - 58px);}
  .sidebar{
    width:224px; min-width:224px; background:#fff; border-right:1px solid var(--line);
    display:flex; flex-direction:column;
  }
  .side-head{
    padding:14px 14px 8px; font-weight:700; font-size:13px; color:#374151;
    display:flex; align-items:center; justify-content:space-between;
  }
  .side-head button{
    width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;font-size:15px;line-height:1;
  }
  .side-head button:hover{background:#1d4ed8;}
  #spaceList{flex:1; overflow-y:auto; padding:4px 8px 8px; list-style:none;}
  #spaceList li{
    display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:8px;
    cursor:pointer; margin-bottom:2px; border:1px solid transparent;
  }
  #spaceList li:hover{background:#f3f6fb;}
  #spaceList li.active{background:#e8effd; border-color:#c7dbfb;}
  #spaceList li.active .s-name{color:var(--accent); font-weight:600;}
  #spaceList .s-icon{font-size:15px;}
  #spaceList .s-name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #spaceList .s-count{
    font-size:11px; color:var(--sub); background:#f1f3f7; border-radius:999px; padding:1px 8px;
  }
  #spaceList li.active .s-count{background:#d5e3fb; color:var(--accent);}
  .side-foot{
    padding:10px 14px; border-top:1px solid var(--line); font-size:11px; color:#9ca3af;
  }

  .main{flex:1; overflow-y:auto; padding:20px 24px 40px;}
  .rightbar{
    width:300px; min-width:300px; background:#fff; border-left:1px solid var(--line);
    padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:14px;
  }

  /* ===== 空间主区 ===== */
  .space-head{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .space-name-input{
    font-size:22px; font-weight:700; border:none; background:transparent;
    padding:4px 8px; border-radius:8px; min-width:120px; max-width:320px;
  }
  .space-name-input:hover{background:#f3f6fb;}
  .space-name-input:focus{background:#fff; border:1px solid var(--accent);}
  .space-meta{color:var(--sub); font-size:13px;}
  .space-head .spacer{flex:1;}
  .cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:1100px){ .cat-grid{grid-template-columns:1fr;} }
  .cat-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 14px 10px; box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .cat-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .cat-head .cat-title{font-size:15px; font-weight:700;}
  .cat-head .cat-bar{width:4px; height:16px; border-radius:2px;}
  .cat-head .badge{font-size:11px; color:var(--sub); background:#f1f3f7; padding:2px 8px; border-radius:999px;}
  .cat-head .add{
    margin-left:auto; color:var(--accent); font-size:12px; padding:4px 10px;
    border:1px dashed #b6ccf7; border-radius:7px;
  }
  .cat-head .add:hover{background:#eef4fe;}
  .rows{display:flex; flex-direction:column; gap:6px;}
  .item-row{
    display:grid; grid-template-columns:12px minmax(110px,1.2fr) 54px 46px minmax(90px,1fr) 26px;
    gap:6px; align-items:center;
  }
  .item-row input{padding:6px 8px; font-size:13px; width:100%;}
  .item-row .i-qty{text-align:center; padding:6px 4px;}
  .item-row .i-del{
    color:#c0c6d1; font-size:14px; border-radius:6px; height:28px;
  }
  .item-row .i-del:hover{color:var(--danger); background:#fee9e9;}
  .cat-empty{color:#9ca3af; font-size:12px; padding:6px 2px;}
  .note-card{
    margin-top:14px; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px; box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .note-card h3{font-size:15px; margin-bottom:10px;}
  .note-card textarea{width:100%; min-height:76px; resize:vertical; line-height:1.6;}
  .empty-main{display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:70%; color:#9ca3af; gap:12px;}
  .empty-main .big{font-size:40px;}

  /* ===== 右栏 全局备注 ===== */
  .panel-title{font-size:15px; font-weight:700; margin-bottom:10px;}
  .gn-add{display:flex; gap:6px; margin-bottom:10px;}
  .gn-add input{flex:1; min-width:0;}
  .gn-add button{
    background:var(--accent); color:#fff; border-radius:8px; padding:0 14px; font-weight:600;
  }
  .gn-add button:hover{background:#1d4ed8;}
  #gnList{list-style:none; display:flex; flex-direction:column; gap:6px;}
  #gnList li{display:flex; gap:6px; align-items:flex-start;}
  #gnList .gn-idx{
    min-width:22px; height:22px; border-radius:6px; background:#eef2fb; color:var(--accent);
    font-size:11px; display:flex; align-items:center; justify-content:center; margin-top:4px; font-weight:700;
  }
  #gnList input{flex:1; min-width:0; font-size:13px; line-height:1.5;}
  #gnList .gn-del{color:#c0c6d1; font-size:14px; margin-top:4px;}
  #gnList .gn-del:hover{color:var(--danger);}
  .gn-empty{color:#9ca3af; font-size:12px;}
  .tips{
    background:#fffbeb; border:1px solid #fde68a; color:#92400e;
    border-radius:10px; padding:10px 12px; font-size:12px; line-height:1.7;
  }

  /* ===== 云同步面板 ===== */
  .sync-body{display:flex; flex-direction:column; gap:8px;}
  .sync-body > input{width:100%; font-size:13px;}
  .sync-row{display:flex; gap:6px;}
  .sync-row input{flex:1; min-width:0; font-size:13px;}
  .sync-row .btn{flex:0 0 auto;}
  .sync-status{
    font-size:12px; color:var(--sub); line-height:1.6; word-break:break-all;
    background:#f6f8fb; border:1px solid var(--line); border-radius:8px; padding:7px 9px;
  }
  .sync-actions{display:flex; gap:6px;}
  .sync-actions .btn{flex:1; padding:6px 2px; font-size:12px; white-space:nowrap;}

  /* ===== toast ===== */
  #toast{
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px);
    background:#111827; color:#fff; padding:10px 20px; border-radius:10px; font-size:13px;
    opacity:0; pointer-events:none; transition:.25s; z-index:99; box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #toast .toast-btn{
    margin-left:12px; background:#2563eb; color:#fff; border-radius:6px;
    padding:4px 12px; font-size:12px; font-weight:600;
  }
  #toast .toast-btn:hover{background:#1d4ed8;}

  /* ===== 弹窗 ===== */
  .modal-mask{
    position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:60;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .modal{
    background:#fff; border-radius:14px; width:100%; max-width:760px;
    max-height:88vh; display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 24px 64px rgba(0,0,0,.28);
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--line);
  }
  .modal-head h3{font-size:16px;}
  .modal-close{color:#9ca3af; font-size:16px; width:30px; height:30px; border-radius:8px;}
  .modal-close:hover{background:#f3f4f6; color:#374151;}
  .modal-body{padding:14px 18px; overflow-y:auto;}
  .modal-footer{
    padding:12px 18px; border-top:1px solid var(--line);
    display:flex; gap:8px; justify-content:flex-end;
  }
  .modal input[type="text"], .modal input[type="password"], .modal select{
    border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:13px;
  }
  .sum-table{width:100%; border-collapse:collapse; font-size:13px;}
  .sum-table th, .sum-table td{
    border-bottom:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top;
  }
  .sum-table th{background:#f6f8fb; font-size:12px; color:#475569; position:sticky; top:-14px;}
  .sum-table .num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .sum-table .cat-cell{font-weight:700; background:#fbfcfe;}
  .sum-table .spaces-cell{color:var(--sub); font-size:12px;}
  .sum-table tfoot td{font-weight:700; border-top:2px solid var(--line); border-bottom:none;}
  .search-row{
    display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:8px; cursor:pointer;
  }
  .search-row:hover{background:#f3f6fb;}
  .search-row .s-tag{
    flex:0 0 auto; font-size:11px; background:#eef2fb; color:var(--accent);
    border-radius:6px; padding:2px 7px; font-weight:600;
  }
  .search-row .s-name{font-weight:600;}
  .search-row .s-note{color:var(--sub); font-size:12px; margin-left:8px;}
  .search-empty{color:#9ca3af; font-size:13px; padding:10px 2px;}
  .cat-manage-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .cat-manage-row input[type="text"]{flex:1;}
  .cat-manage-row select{flex:0 0 auto;}
  .cat-manage-row input[type="color"]{
    width:34px; height:30px; padding:2px; border:1px solid var(--line); border-radius:8px; background:#fff;
  }
  .cat-manage-del{color:var(--danger); font-size:12px; flex:0 0 auto; padding:5px 8px;}
  .cat-manage-del:hover{background:#fee9e9; border-radius:6px;}
  .item-row .i-handle{
    color:#c3cad6; font-size:13px; cursor:grab; text-align:center; user-select:none;
  }
  .item-row .i-handle:active{cursor:grabbing;}
  .item-row.drag-src{opacity:.35;}
  .item-row.drag-over{box-shadow:0 -2px 0 var(--accent);}
  #spaceList li.drag-over{border-top:2px solid var(--accent);}
  .item-row.flash{animation:flashRow 1.8s ease;}
  @keyframes flashRow{
    0%, 55%{background:#fff7db; box-shadow:0 0 0 2px #f59e0b inset;}
    100%{background:transparent;}
  }
  .i-unit{font-size:12px !important;}

  /* ===== 打印：只打印汇总弹窗表格 ===== */
  @media print{
    body{overflow:visible; height:auto; background:#fff;}
    .topbar, .layout, #toast{display:none !important;}
    .modal-mask{position:static; background:none; padding:0; display:block;}
    .modal{max-width:none; max-height:none; box-shadow:none; border-radius:0;}
    .modal-head, .modal-footer{display:none;}
    .modal-body{overflow:visible; padding:0;}
    .sum-table th{position:static;}
  }

  /* ===== 移动端适配（≤820px；PC 端不受影响） ===== */
  .menu-toggle{display:none;}
  @media (max-width:820px){
    html,body{height:auto;}
    body{overflow:auto;}
    .menu-toggle{
      display:flex; align-items:center; justify-content:center;
      width:34px; height:34px; border-radius:8px; border:1px solid var(--line);
      background:#fff; font-size:17px; flex:0 0 auto;
    }
    .topbar{flex-wrap:wrap; height:auto; padding:10px 12px; row-gap:8px;}
    .brand{font-size:16px; flex:1;}
    .stats{order:3; flex-basis:100%;}
    .actions{order:4; flex-basis:100%; display:none; flex-wrap:wrap;}
    .topbar.menu-open .actions{display:flex;}
    .actions .btn{flex:1; min-width:calc(50% - 4px);}
    .layout{display:block; height:auto;}
    .sidebar{width:auto; min-width:0; border-right:none; border-bottom:1px solid var(--line);}
    .side-head{padding:10px 12px 4px;}
    #spaceList{display:flex; overflow-x:auto; padding:6px 8px 10px; gap:6px;}
    #spaceList li{flex:0 0 auto; margin-bottom:0; border:1px solid var(--line); background:#fff; padding:7px 11px;}
    #spaceList li.active{border-color:#c7dbfb;}
    .side-foot{border-top:none; padding:0 12px 10px;}
    .main{padding:14px 12px 30px; overflow:visible;}
    .space-head{flex-wrap:wrap;}
    .space-head .btn{white-space:nowrap;}
    .space-name-input{font-size:19px; min-width:100px;}
    .item-row{
      grid-template-columns:minmax(100px,1fr) 54px 44px 26px;
      grid-template-areas:"name qty unit del" "note note note note";
    }
    .item-row .i-name{grid-area:name;}
    .item-row .i-qty{grid-area:qty;}
    .item-row .i-unit{grid-area:unit;}
    .item-row .i-del{grid-area:del;}
    .item-row .i-note{grid-area:note;}
    .item-row .i-handle{display:none;}
    .rightbar{width:auto; min-width:0; border-left:none; border-top:1px solid var(--line);}
    input,textarea{font-size:16px;} /* 防 iOS 聚焦自动放大 */
    .item-row input{font-size:16px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🏠 全屋智能点位工作台</div>
  <button class="menu-toggle" id="menuToggle" title="菜单">☰</button>
  <div class="stats" id="globalStats"></div>
  <div class="actions">
    <button class="btn primary" id="btnExport">⬇️ 导出 Excel</button>
    <button class="btn" id="btnSummary">📋 全屋汇总</button>
    <button class="btn" id="btnSearch">🔍 搜索</button>
    <button class="btn" id="btnBackup">备份 JSON</button>
    <button class="btn" id="btnImport">导入 JSON</button>
    <button class="btn ghost-danger" id="btnReset">恢复初始数据</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="side-head">室内空间 <button id="btnAddSpace" title="添加空间">＋</button></div>
    <ul id="spaceList"></ul>
    <div class="side-foot" id="saveStatus">数据自动保存在本机浏览器</div>
  </aside>

  <main class="main" id="mainArea"></main>

    <aside class="rightbar">
    <div>
      <div class="panel-title">📌 全局备注</div>
      <div class="gn-add">
        <input id="gnInput" placeholder="输入全局备注，回车添加…">
        <button id="gnAddBtn">添加</button>
      </div>
      <ul id="gnList"></ul>
    </div>

    <div>
      <div class="panel-title">🔄 云同步（多设备）</div>
      <div class="sync-body">
        <input id="syncToken" type="password" placeholder="粘贴 GitHub Token（勾选 gist 权限）">
        <div class="sync-row">
          <input id="syncGist" placeholder="Gist ID（留空则自动创建）">
          <button id="syncConnect" class="btn primary">连接</button>
        </div>
        <div class="sync-status" id="syncStatus">未配置：粘贴 Token 后点「连接」</div>
        <div class="sync-actions">
          <button class="btn" id="syncUp" title="无条件用当前数据覆盖云端">⬆ 强制上传</button>
          <button class="btn" id="syncDown" title="无条件用云端数据覆盖本地">⬇ 强制下载</button>
          <button class="btn ghost-danger" id="syncUnlink">断开</button>
        </div>
      </div>
    </div>

    <div class="tips">
      💾 所有修改实时保存在本机浏览器中，无需手动保存。<br>
      🔁 换电脑或清理浏览器前，请先「备份 JSON」，再在另一台设备「导入 JSON」。<br>
      📄 「导出 Excel」生成 .xlsx 文件，含点位总表 / 明细清单 / 汇总清单 / 全局备注四个工作表。
    </div>
  </aside>
</div>

<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
 * 全屋智能点位工作台
 * 数据模型：state = { spaces:[{id,name,note,items:[{id,cat,name,qty,note}]}], globalNotes:[{id,text}] }
 * ===================================================================== */

const DEFAULT_CATS = [
  { name: '灯',     icon: '💡', color: '#f59e0b' },
  { name: '开关',   icon: '🔘', color: '#3b82f6' },
  { name: '插座',   icon: '🔌', color: '#ec4899' },
  { name: '传感器', icon: '📡', color: '#10b981' },
  { name: '其他',   icon: '🧩', color: '#8b5cf6' },
];
const CAT_ICON_CHOICES = ['💡', '🔘', '🔌', '📡', '🧩', '📦', '🪟', '❄️', '🎥', '🚪', '🔒', '🌡️', '🚰', '🧹', '📺', '🔊', '🛗', '🛠️'];
const CAT_COLOR_CHOICES = ['#f59e0b', '#3b82f6', '#ec4899', '#10b981', '#8b5cf6', '#ef4444', '#14b8a6', '#f97316', '#64748b'];
let CATS = DEFAULT_CATS.map(c => c.name);
const STORE_KEY = 'smarthome-point-workbench-v1';

function catInfo(name) {
  return state.cats.find(c => c.name === name) || { name, icon: '📦', color: '#64748b' };
}
function rebuildCats() {
  CATS = state.cats.map(c => c.name);
}
/* 旧数据迁移：补 cats / 单位 / updatedAt；把项目里出现的未知分类自动注册；
 * 坏数据兜底（缺 items/globalNotes、非法 qty/icon/color、重名分类合并），避免渲染崩溃 */
function migrateState(s) {
  if (!Array.isArray(s.cats) || !s.cats.length) s.cats = deepClone(DEFAULT_CATS);
  s.cats.forEach(c => {
    c.name = String(c.name || '').trim() || '未命名';
    if (!CAT_ICON_CHOICES.includes(c.icon)) c.icon = '📦';
    if (!/^#[0-9a-fA-F]{6}$/.test(String(c.color || ''))) c.color = '#64748b';
  });
  /* 重名分类合并到第一个 */
  for (let i = 0; i < s.cats.length; i++) {
    for (let j = s.cats.length - 1; j > i; j--) {
      if (s.cats[j].name === s.cats[i].name) {
        (s.spaces || []).forEach(sp => (sp.items || []).forEach(it => { if (it.cat === s.cats[j].name) it.cat = s.cats[i].name; }));
        s.cats.splice(j, 1);
      }
    }
  }
  (s.spaces || []).forEach(sp => {
    if (!Array.isArray(sp.items)) sp.items = [];
    sp.items.forEach(it => {
      if (it.cat && !s.cats.some(c => c.name === it.cat)) s.cats.push({ name: it.cat, icon: '📦', color: '#64748b' });
      if (typeof it.unit !== 'string') it.unit = '';
      if (!it.id) it.id = uid();
      if (typeof it.qty === 'number' && it.qty > 0) it.qty = Math.floor(it.qty);
      else if (typeof it.qty === 'string' && /^\d+$/.test(it.qty.trim()) && Number(it.qty) > 0) it.qty = Number(it.qty.trim());
      else it.qty = null;
      if (typeof it.name !== 'string') it.name = it.name == null ? '' : String(it.name);

/* ---------- 统计 ---------- */
function spaceStats(sp) {
  const per = {}; let total = 0, items = 0;
  for (const c of CATS) {
    const list = sp.items.filter(i => i.cat === c && i.name);
    const points = list.reduce((a, i) => a + (i.qty || 1), 0);
    per[c] = { items: list.length, points };
    total += points; items += list.length;
  }
  return { per, total, items };
}
function globalStats() {
  const g = { spaces: state.spaces.length, per: {}, total: 0, items: 0 };
  for (const c of CATS) g.per[c] = { items: 0, points: 0 };
  for (const sp of state.spaces) {
    const s = spaceStats(sp);
    g.total += s.total; g.items += s.items;
    for (const c of CATS) { g.per[c].items += s.per[c].items; g.per[c].points += s.per[c].points; }
  }
  return g;
}

 * 极简 XLSX 生成器（纯 JS，无需依赖；xlsx = zip(xml)）
 * ===================================================================== */
const XLSXWriter = (() => {
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;

    let len = 0;
    for (const ch of chunks) len += ch.length;

    const dosDate = (((now.getFullYear() - 1980) & 127) << 9) | (((now.getMonth() + 1) & 15) << 5) | (now.getDate() & 31);
    const chunks = [], central = [];
    let offset = 0;
    for (const f of files) {
      const nameU8 = enc.encode(f.name);
      const data = f.data;
      const crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0x0800, true);          // UTF-8 文件名
      lh.setUint16(8, 0, true);               // STORE
      lh.setUint16(10, dosTime, true);
      lh.setUint16(12, dosDate, true);
      lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true);
      lh.setUint32(22, data.length, true);
      lh.setUint16(26, nameU8.length, true);
      lh.setUint16(28, 0, true);
      chunks.push(new Uint8Array(lh.buffer), nameU8, data);
      central.push({ nameU8, crc, size: data.length, offset });
      offset += 30 + nameU8.length + data.length;
    }
    const cdStart = offset;
    for (const c of central) {
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true);
      ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 0, true);
      ch.setUint16(12, dosTime, true);
      ch.setUint16(14, dosDate, true);
      ch.setUint32(16, c.crc, true);
      ch.setUint32(20, c.size, true);
      ch.setUint32(24, c.size, true);
      ch.setUint16(28, c.nameU8.length, true);
      ch.setUint32(42, c.offset, true);
      chunks.push(new Uint8Array(ch.buffer), c.nameU8);
      offset += 46 + c.nameU8.length;
    }
    const eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(8, central.length, true);
    eocd.setUint16(10, central.length, true);

      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>';
    sheets.forEach((sh, i) => {
      ct += '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    });
    ct += '</Types>';
    files.push({ name: '[Content_Types].xml', data: enc.encode(ct) });
    // _rels/.rels
    files.push({
      name: '_rels/.rels', data: enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
        '<Relationships xmlns="' + PNS + '">' +
        '<Relationship Id="rId1" Type="' + RNS + '/officeDocument" Target="xl/workbook.xml"/>' +
        '</Relationships>')
    });
    // xl/workbook.xml
    let wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<workbook xmlns="' + NS + '" xmlns:r="' + RNS + '"><sheets>';
    sheets.forEach((sh, i) => {
      wb += '<sheet name="' + esc(sh.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
    });
    wb += '</sheets></workbook>';
    files.push({ name: 'xl/workbook.xml', data: enc.encode(wb) });
    // xl/_rels/workbook.xml.rels
    let rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="' + PNS + '">';
    sheets.forEach((sh, i) => {
      rels += '<Relationship Id="rId' + (i + 1) + '" Type="' + RNS + '/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>';
    });
    rels += '<Relationship Id="rId' + (sheets.length + 1) + '" Type="' + RNS + '/styles" Target="styles.xml"/>';
    rels += '</Relationships>';
    files.push({ name: 'xl/_rels/workbook.xml.rels', data: enc.encode(rels) });
    files.push({ name: 'xl/styles.xml', data: enc.encode(STYLES_XML) });
    sheets.forEach((sh, i) => files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: enc.encode(sheetXml(sh)) }));
    return zip(files);
  }
  return { build, colName };
})();

/* ---------- 由 state 生成三个工作表 ---------- */
function fmtItem(it) {
  return it.name + (it.qty ? '*' + it.qty : '') + (it.note ? '（' + it.note + '）' : '');
}
function buildSheetsFromState(st) {
  const sheets = [];
  /* ---- Sheet1 点位总表 ---- */
  {
    const rows = [], merges = [];
    rows.push({ ht: 30, cells: [{ v: '全屋智能点位表', s: 4 }] });
    merges.push('A1:' + XLSXWriter.colName(CATS.length + 1) + '1');
    rows.push({ ht: 24, cells: ['空间', ...CATS, '单独备注'].map(h => ({ v: h, s: 1 })) });
    const totals = {}; let totalItems = 0;
    for (const c of CATS) totals[c] = { items: 0, points: 0 };
    for (const sp of st.spaces) {
      const by = {}; let maxLines = 1;
      for (const c of CATS) {
        by[c] = sp.items.filter(i => i.cat === c && i.name).map(fmtItem);
        if (by[c].length > maxLines) maxLines = by[c].length;
      }
      const note = sp.note || '';
      const noteLines = Math.ceil(note.length / 12);
      const ht = Math.max(maxLines, noteLines) * 16 + 6;
      rows.push({
        ht,
        cells: [
          { v: sp.name, s: 3 },
          ...CATS.map(c => ({ v: by[c].join('\n'), s: 2 })),
          { v: note, s: 6 },
        ],
      });
      const sst = spaceStats(sp);
      totalItems += sst.items;
      for (const c of CATS) { totals[c].items += sst.per[c].items; totals[c].points += sst.per[c].points; }
    }
    rows.push({
      ht: 24,
      cells: [
        { v: '合计', s: 3 },
        ...CATS.map(c => ({ v: totals[c].items + ' 项 / ' + totals[c].points + ' 个', s: 2 })),
        { v: '共 ' + st.spaces.length + ' 个空间 · ' + totalItems + ' 项', s: 6 },
      ],
    });
    sheets.push({ name: '点位总表', cols: [10, ...CATS.map(() => 22), 24], rows, merges, freeze: 2 });
  }
  /* ---- Sheet2 明细清单 ---- */
  {
    const rows = [];
    rows.push({ ht: 24, cells: ['空间', '类别', '项目', '数量', '单位', '备注'].map(h => ({ v: h, s: 1 })) });
    for (const sp of st.spaces) {
      for (const c of CATS) {
        for (const it of sp.items) {
          if (it.cat !== c || !it.name) continue;
          rows.push({ cells: [{ v: sp.name, s: 2 }, { v: c, s: 5 }, { v: it.name, s: 2 }, { v: it.qty == null ? '' : it.qty, s: 5 }, { v: it.unit || '', s: 5 }, { v: it.note || '', s: 6 }] });
        }
      }
    }
    const filterEnd = XLSXWriter.colName(5) + rows.length; // A1:F{last}
    sheets.push({ name: '明细清单', cols: [12, 10, 26, 8, 8, 28], rows, freeze: 1, autoFilter: 'A1:' + filterEnd });
  }
  /* ---- Sheet3 汇总清单（跨空间同名合计，采购/交底用） ---- */
  {
    const rows = [];
    rows.push({ ht: 24, cells: ['类别', '项目', '单位', '合计数量', '涉及空间数', '涉及空间'].map(h => ({ v: h, s: 1 })) });
    let grand = 0, kinds = 0;
    for (const grp of buildSummary()) {
      if (!grp.rows.length) continue;
      let sub = 0;
      for (const r of grp.rows) {
        sub += r.total; grand += r.total; kinds++;
        rows.push({ cells: [{ v: grp.cat, s: 2 }, { v: r.name, s: 2 }, { v: r.units.join('/'), s: 5 }, { v: r.total, s: 5 }, { v: r.spaces.length, s: 5 }, { v: r.spaces.join('、'), s: 2 }] });
      }
      rows.push({ ht: 22, cells: [{ v: grp.cat + ' 小计', s: 3 }, { v: '', s: 2 }, { v: '', s: 5 }, { v: sub, s: 5 }, { v: '', s: 5 }, { v: '', s: 2 }] });
    }
    rows.push({ ht: 24, cells: [{ v: '全屋合计', s: 3 }, { v: kinds + ' 种项目', s: 2 }, { v: '', s: 5 }, { v: grand, s: 5 }, { v: '', s: 5 }, { v: st.spaces.length + ' 个空间', s: 2 }] });
    /* 含小计/合计行，不加 autoFilter（筛选会把合计当数据行） */
    sheets.splice(2, 0, { name: '汇总清单', cols: [10, 26, 8, 10, 11, 40], rows, freeze: 1 });
  }
  /* ---- Sheet3 全局备注 ---- */
  {
    const rows = [];
    rows.push({ ht: 24, cells: ['序号', '备注内容'].map(h => ({ v: h, s: 1 })) });
    st.globalNotes.forEach((g, i) => {
      rows.push({ cells: [{ v: i + 1, s: 5 }, { v: g.text || '', s: 2 }] });
    });
    sheets.push({ name: '全局备注', cols: [6, 90], rows, freeze: 1 });
  }
  return sheets;
}

/* ---------- 下载 ---------- */
function downloadBytes(u8, filename, mime) {
  const blob = new Blob([u8], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function exportExcel() {
  const sheets = buildSheetsFromState(state);
  const bytes = XLSXWriter.build(sheets);
  const d = new Date();
  const ds = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  downloadBytes(bytes, '全屋智能点位表_' + ds + '.xlsx',
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  toast('✅ 已导出 Excel（点位总表 / 明细清单 / 汇总清单 / 全局备注）');
}
function exportJSON() {
  const txt = JSON.stringify(state, null, 2);
  const d = new Date();
  const ds = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  downloadBytes(new TextEncoder().encode(txt), '全屋智能点位备份_' + ds + '.json', 'application/json');
  toast('✅ 已备份 JSON 文件');
}

/* =====================================================================
 * 云同步（GitHub Gist，免费）：整份 state 以 JSON 存入私密 Gist，
 * 各设备用同一 Token 连接后自动拉取/推送；按 updatedAt 时间戳防互相覆盖
 * ===================================================================== */
const SYNC_CFG_KEY = 'smarthome-point-sync-v1';
const GIST_FILENAME = '全屋智能点位数据.json';
const GH_API = 'https://api.github.com';

function loadSyncCfg() {
  try { return JSON.parse(localStorage.getItem(SYNC_CFG_KEY)) || null; } catch (e) { return null; }
}
let syncCfg = (typeof localStorage !== 'undefined') ? loadSyncCfg() : null;
let syncPushTimer = null, syncRetryTimer = null, syncBusy = false;

function syncConfigured() { return !!(syncCfg && syncCfg.token && syncCfg.gistId); }
function setSyncStatus(msg) {
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = msg;
}
function saveSyncCfg() {
  if (typeof localStorage === 'undefined') return;
  localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(syncCfg));
}
function renderSyncPanel() {
  const t = document.getElementById('syncToken');
  const gi = document.getElementById('syncGist');
  if (!t || !gi) return;
  t.value = (syncCfg && syncCfg.token) ? syncCfg.token : '';
  gi.value = (syncCfg && syncCfg.gistId) ? syncCfg.gistId : '';
}
function ghApi(path, token, opts) {
  return fetch(GH_API + path, Object.assign({
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
  }, opts || {}));
}
async function ghGistGet(token, id) {
  const r = await ghApi('/gists/' + encodeURIComponent(id), token);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('GitHub API ' + r.status + (r.status === 401 ? '（Token 无效或权限不足）' : ''));
  return r.json();
}
async function ghGistCreate(token, content) {
  const files = {}; files[GIST_FILENAME] = { content };
  const r = await ghApi('/gists', token, {
    method: 'POST',
    body: JSON.stringify({ description: '全屋智能点位工作台数据（自动云同步，请勿删除）', public: false, files }),
  });
  if (!r.ok) throw new Error('创建 Gist 失败（' + r.status + (r.status === 401 ? '，Token 无效或未勾选 gist 权限' : '') + '）');
  return r.json();
}
async function ghGistUpdate(token, id, content) {
  const files = {}; files[GIST_FILENAME] = { content };
  const r = await ghApi('/gists/' + encodeURIComponent(id), token, { method: 'PATCH', body: JSON.stringify({ files }) });
  if (!r.ok) throw new Error('更新 Gist 失败（' + r.status + '）');
  return r.json();
}
function gistDataOf(g) {
  const f = g && g.files && g.files[GIST_FILENAME];
  if (!f || !f.content) return null;
  try { return JSON.parse(f.content); } catch (e) { return null; }
}
function fmtTime(ts) {
  return ts ? new Date(ts).toLocaleString('zh-CN', { hour12: false }) : '未知时间';
}

function scheduleSyncPush() {
  if (!syncConfigured()) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(() => syncPush(false), 4000);
}
/* 单一重试链：新的重试会替换旧的，断开连接/上传成功时由调用方清除 */
function scheduleSyncRetry() {
  clearTimeout(syncRetryTimer);
  syncRetryTimer = setTimeout(() => { syncRetryTimer = null; syncPush(false, true); }, 30000);
}

/* 检查云端状态，只更新状态行 */
async function syncCheck(quiet) {
  if (!syncConfigured()) return;
  if (!quiet) setSyncStatus('… 正在检查云端');
  try {
    const g = await ghGistGet(syncCfg.token, syncCfg.gistId);
    if (!g) { setSyncStatus('云端还没有同步数据：点「⬆ 强制上传」完成首次上传'); return; }
    const remote = gistDataOf(g);
    if (!remote || !Array.isArray(remote.spaces)) { setSyncStatus('⚠ 云端 Gist 里没有有效的点位数据'); return; }
    const rT = remote.updatedAt || 0, lT = state.updatedAt || 0;
    if (rT > lT) {
      setSyncStatus('☁️ 云端更新（' + fmtTime(rT) + '）：点「⬇ 强制下载」获取');
    } else {
      /* 云端与本地一致，或云端是本机旧版本：之后允许自动上传 */
      syncCfg.mySynced = rT;
      saveSyncCfg();
      if (rT < lT) setSyncStatus('💾 本地较新，修改会自动上传');
      else setSyncStatus('✅ 本地与云端一致（' + fmtTime(rT) + '）');
    }
  } catch (e) {
    setSyncStatus('❌ 连接失败：' + e.message);
  }
}

/* 上传。force=false 时若云端被其他设备更新过则暂停，防止互相覆盖；
 * silent=true 时不改状态栏（用于后台自动重试） */
async function syncPush(force, silent) {
  if (!syncConfigured()) return;
  if (syncBusy) { if (!force) scheduleSyncRetry(); return; } // 忙碌时改约 30 秒后再试，不丢推送也不叠加
  syncBusy = true;
  clearTimeout(syncPushTimer);
  clearTimeout(syncRetryTimer);
  try {
    if (!silent) setSyncStatus(force ? '⬆ 正在强制上传…' : '⬆ 正在自动上传…');
    let g = null, fetchErr = null;
    try { g = await ghGistGet(syncCfg.token, syncCfg.gistId); }
    catch (e) { fetchErr = e; }
    if (fetchErr) {
      /* 网络/权限失败时绝不能走“创建新 Gist”分支，否则会造成数据分叉 */
      const retryable = !/GitHub API 40[13]/.test(fetchErr.message);
      setSyncStatus('❌ 上传前无法访问云端（' + fetchErr.message + '）' + (retryable ? '，30 秒后自动重试' : ''));
      syncBusy = false;
      if (retryable && !force) scheduleSyncRetry();
      return;
    }
    const remote = g ? gistDataOf(g) : null;
    if (!force && remote && Array.isArray(remote.spaces) && (remote.updatedAt || 0) !== (syncCfg.mySynced || 0)) {
      setSyncStatus('⚠ 云端数据已被其他设备更新（' + fmtTime(remote.updatedAt) + '），自动上传已暂停。请选择：「⬇ 强制下载」采用云端，或「⬆ 强制上传」用本机覆盖');
      syncBusy = false;
      return;
    }
    if (g && g.id) {
      try {
        await ghGistUpdate(syncCfg.token, syncCfg.gistId, JSON.stringify(state));
      } catch (e) {
        setSyncStatus('❌ 上传失败：' + e.message);
        syncBusy = false;
        if (!force) scheduleSyncRetry();
        return;
      }
    } else {
      /* 只有确认云端 Gist 确实不存在（404）才会走到这里 */
      const ng = await ghGistCreate(syncCfg.token, JSON.stringify(state));
      syncCfg.gistId = ng.id;
      renderSyncPanel();
    }
    syncCfg.mySynced = state.updatedAt || 0;
    saveSyncCfg();
    if (!silent) setSyncStatus('✅ 已上传到云端 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false }));
  } catch (e) {
    setSyncStatus('❌ 上传失败：' + e.message);
  }
  syncBusy = false;
}

/* 下载云端数据覆盖本地 */
async function syncDownload(skipConfirm) {
  if (!syncConfigured() || syncBusy) return;
  syncBusy = true;
  try {
    setSyncStatus('⬇ 正在从云端下载…');
    const g = await ghGistGet(syncCfg.token, syncCfg.gistId);
    if (!g) { setSyncStatus('云端还没有同步数据：点「⬆ 强制上传」完成首次上传'); syncBusy = false; return; }
    const remote = gistDataOf(g);
    if (!remote || !Array.isArray(remote.spaces)) { setSyncStatus('⚠ 云端 Gist 里没有有效的点位数据'); syncBusy = false; return; }
    if (!skipConfirm) {
      if (!confirm('将用云端数据（更新于 ' + fmtTime(remote.updatedAt) + '）覆盖本机当前数据，确定吗？')) {
        setSyncStatus('已取消下载');
        syncBusy = false;
        return;
      }
    }
    state = migrateState(remote);
    rebuildCats();
    selectedId = state.spaces.length ? state.spaces[0].id : null;
    save();
    renderAll();
    renderSyncPanel();
    setSyncStatus('✅ 已下载云端数据到本机');
    syncBusy = false;
    /* 立即回传一次，让云端时间戳与本地对齐（内容一致），避免之后误判冲突 */
    await syncPush(true, true);
    return;
  } catch (e) {
    setSyncStatus('❌ 下载失败：' + e.message);
  }
  syncBusy = false;
}

function initSyncPanel() {
  renderSyncPanel();
  if (syncConfigured()) setSyncStatus('已连接 Gist（' + syncCfg.gistId.slice(0, 7) + '…），修改会自动上传');
  document.getElementById('syncConnect').addEventListener('click', async () => {
    const token = document.getElementById('syncToken').value.trim();
    const gistId = document.getElementById('syncGist').value.trim();
    if (!token) { toast('请先粘贴 GitHub Token'); return; }
    const prevCfg = syncCfg;
    syncCfg = { token, gistId };
    setSyncStatus('… 正在连接');
    try {
      if (!gistId) {
        const ng = await ghGistCreate(token, JSON.stringify(state));
        syncCfg.gistId = ng.id;
        syncCfg.mySynced = state.updatedAt || 0;
        saveSyncCfg();
        renderSyncPanel();
        setSyncStatus('✅ 已连接并创建云端 Gist，当前数据已上传，其他设备连接时请填入同一 Gist ID');
      } else {
        const g = await ghGistGet(token, gistId);
        const remote = g ? gistDataOf(g) : null;
        const rT = remote && Array.isArray(remote.spaces) ? (remote.updatedAt || 0) : 0;
        /* 云端不比本地新 → 允许后续自动上传；云端更新 → 先要求用户明确「下载」或「强制上传」 */
        syncCfg.mySynced = rT <= (state.updatedAt || 0) ? rT : 0;
        saveSyncCfg();
        await syncCheck(false);
      }
      toast('✅ 云同步已连接');
    } catch (e) {
      /* 连接失败：恢复连接前的配置（可能是 null），避免坏 Token 覆盖好配置后刷新“复活” */
      syncCfg = prevCfg;
      if (prevCfg) saveSyncCfg();
      else if (typeof localStorage !== 'undefined') localStorage.removeItem(SYNC_CFG_KEY);
      renderSyncPanel();
      setSyncStatus('❌ 连接失败：' + e.message);
    }
  });
  document.getElementById('syncUp').addEventListener('click', () => {
    if (!syncConfigured()) { toast('请先粘贴 Token 并点「连接」'); return; }
    syncPush(true);
  });
  document.getElementById('syncDown').addEventListener('click', () => {
    if (!syncConfigured()) { toast('请先粘贴 Token 并点「连接」'); return; }
    syncDownload(false);
  });
  document.getElementById('syncUnlink').addEventListener('click', () => {
    if (!syncCfg) { toast('当前未连接云同步'); return; }
    if (!confirm('断开云同步？\n（只清除本机的连接信息，云端 Gist 数据会保留）')) return;
    clearTimeout(syncPushTimer);
    clearTimeout(syncRetryTimer);
    syncCfg = null;
    if (typeof localStorage !== 'undefined') localStorage.removeItem(SYNC_CFG_KEY);
    renderSyncPanel();
    setSyncStatus('未配置：粘贴 Token 后点「连接」');
  });
  window.addEventListener('focus', () => { if (syncConfigured()) syncCheck(true); });
}

/* =====================================================================
 * 界面渲染
 * ===================================================================== */
let toastTimer = null, toastActionFn = null;
function toast(msg, actionLabel, actionFn) {
  const t = document.getElementById('toast');
  t.innerHTML = h(msg) + (actionLabel ? '<button class="toast-btn">' + h(actionLabel) + '</button>' : '');
  toastActionFn = actionFn || null;
  if (actionLabel) {
    t.querySelector('.toast-btn').addEventListener('click', () => {
      t.classList.remove('show');
      const fn = toastActionFn;
      toastActionFn = null;
      if (fn) fn();
    });
  }
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), actionLabel ? 6000 : 2600);
}

/* ---------- 撤销：破坏性操作前拍快照，toast 里一键回滚 ---------- */
let undoSnapshot = null;
function takeSnapshot() {
  undoSnapshot = deepClone(state);
  return undoSnapshot;
}
/* 校验快照仍是最新的待撤销状态，防止旧 toast 的「撤销」回滚掉新操作 */
function undoIfCurrent(snap) {
  if (undoSnapshot !== snap) { toast('该撤销已失效（后面有新的操作）'); return; }
  undoLast();
}
function undoLast() {
  if (!undoSnapshot) { toast('没有可撤销的操作'); return; }
  state = undoSnapshot;
  undoSnapshot = null;
  rebuildCats();
  if (!state.spaces.some(s => s.id === selectedId)) selectedId = state.spaces.length ? state.spaces[0].id : null;
  save();
  renderAll();
  toast('✅ 已撤销上一步操作');
}

function renderStats() {
  const g = globalStats();
  const el = document.getElementById('globalStats');
  el.innerHTML =
    '<span class="chip">🏘️ 空间 <b>' + g.spaces + '</b></span>' +
    state.cats.map(c => {
      const p = g.per[c.name] || { items: 0, points: 0 };
      return '<span class="chip">' + c.icon + ' ' + h(c.name) + ' <b>' + p.items + '</b> 项 · <b>' + p.points + '</b> 个点位</span>';
    }).join('') +
    '<span class="chip">Σ 合计 <b>' + g.total + '</b> 个点位</span>';
}

function renderSidebar() {
  const ul = document.getElementById('spaceList');
  ul.innerHTML = '';
  for (const sp of state.spaces) {
    const st = spaceStats(sp);
    const li = document.createElement('li');
    li.dataset.id = sp.id;
    li.draggable = true;
    if (sp.id === selectedId) li.classList.add('active');
    li.innerHTML = '<span class="s-icon">' + spaceIcon(sp.name) + '</span>' +
      '<span class="s-name"></span><span class="s-count">' + st.total + '</span>';
    li.querySelector('.s-name').textContent = sp.name || '未命名';
    li.addEventListener('click', () => { selectedId = sp.id; renderSidebar(); renderMain(); });
    ul.appendChild(li);
  }
}

function renderCategoryRows(sp, cat, container) {
  const list = sp.items.filter(i => i.cat === cat);
  container.innerHTML = '';
  if (!list.length) {
    container.innerHTML = '<div class="cat-empty">暂无项目，点击右上角「＋ 添加」</div>';
    return;
  }
  for (const it of list) {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.dataset.id = it.id;
    row.innerHTML =
      '<span class="i-handle" title="拖动排序">⠿</span>' +
      '<input class="i-name" placeholder="项目名称" list="allNames">' +
      '<input class="i-qty" type="number" min="1" max="999" placeholder="—" title="数量，留空表示未定">' +
      '<input class="i-unit" placeholder="单位" title="单位，如：个 / 路 / 米">' +
      '<input class="i-note" placeholder="备注（选填）">' +
      '<button class="i-del" title="删除">✕</button>';
    const nameI = row.querySelector('.i-name');
    const qtyI = row.querySelector('.i-qty');

function openModal(title, bodyHtml, footerHtml) {
  closeModal();
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.id = 'modalMask';
  mask.innerHTML =
    '<div class="modal"><div class="modal-head"><h3>' + h(title) + '</h3>' +
    '<button class="modal-close" title="关闭">✕</button></div>' +
    '<div class="modal-body">' + bodyHtml + '</div>' +
    (footerHtml ? '<div class="modal-footer">' + footerHtml + '</div>' : '') +
    '</div>';
  document.body.appendChild(mask);
  mask.querySelector('.modal-close').addEventListener('click', closeModal);
  mask.addEventListener('mousedown', e => { if (e.target === mask) closeModal(); });
  return mask;
}
function closeModal() {
  const m = document.getElementById('modalMask');
  if (m) m.remove();
}

/* ---------- 全屋汇总（跨空间同名合计，可用于采购/交底） ---------- */
function buildSummary() {
  return CATS.map(cat => {
    const m = new Map();
    for (const sp of state.spaces) {
      for (const it of sp.items) {
        if (it.cat !== cat || !it.name) continue;
        let row = m.get(it.name);
        if (!row) { row = { name: it.name, units: [], total: 0, spaces: [] }; m.set(it.name, row); }
        row.total += (it.qty || 1);
        if (it.unit && !row.units.includes(it.unit)) row.units.push(it.unit);
        if (!row.spaces.includes(sp.name)) row.spaces.push(sp.name);
      }
    }
    const rows = Array.from(m.values()).sort((a, b) => b.total - a.total);
    return { cat, rows };
  });
}
function openSummaryModal() {
  const groups = buildSummary();
  let rowsHtml = '';
  let grand = 0, kinds = 0;
  for (const grp of groups) {
    if (!grp.rows.length) continue;
    let sub = 0;
    for (const r of grp.rows) {
      sub += r.total; grand += r.total; kinds++;
      rowsHtml += '<tr><td class="cat-cell">' + h(grp.cat) + '</td><td>' + h(r.name) + '</td><td>' +
        h(r.units.join('/')) + '</td><td class="num">' + r.total + '</td><td class="spaces-cell">' +
        r.spaces.length + ' 处：' + h(r.spaces.join('、')) + '</td></tr>';
    }
    rowsHtml += '<tr><td colspan="3" class="cat-cell">' + h(grp.cat) + ' 小计</td><td class="num">' + sub + '</td><td></td></tr>';
  }
  const body =
    '<table class="sum-table"><thead><tr><th>类别</th><th>项目</th><th>单位</th><th class="num">合计</th><th>涉及空间</th></tr></thead>' +
    '<tbody>' + (rowsHtml || '<tr><td colspan="5">暂无数据</td></tr>') + '</tbody>' +
    '<tfoot><tr><td colspan="3">全屋合计（' + kinds + ' 种项目）</td><td class="num">' + grand + '</td><td>' + state.spaces.length + ' 个空间</td></tr></tfoot></table>';
  openModal('📋 全屋汇总清单（采购 / 交底用）', body,
    '<button class="btn primary" id="btnPrintSummary">🖨 打印</button><button class="btn" id="btnCloseSummary">关闭</button>');
  document.getElementById('btnPrintSummary').addEventListener('click', () => window.print());
  document.getElementById('btnCloseSummary').addEventListener('click', closeModal);
}

/* ---------- 全局搜索 ---------- */
function openSearchModal() {
  const mask = openModal('🔍 全局搜索',
    '<input type="text" id="searchInput" placeholder="输入关键字，跨空间搜索项目名称与备注…" style="width:100%">' +
    '<div id="searchResults" style="margin-top:10px"></div>', '');
  const input = mask.querySelector('#searchInput');
  const box = mask.querySelector('#searchResults');
  function renderResults(qRaw) {
    const q = qRaw.trim().toLowerCase();
    if (!q) { box.innerHTML = '<div class="search-empty">输入关键字开始搜索</div>'; return; }
    const hits = [];
    for (const sp of state.spaces) {
      for (const it of sp.items) {
        if (!it.name) continue;
        const inName = it.name.toLowerCase().includes(q);
        const inNote = (it.note || '').toLowerCase().includes(q);
        if (inName || inNote) hits.push({ sp, it, inName });
      }
    }
    if (!hits.length) { box.innerHTML = '<div class="search-empty">没有匹配的项目</div>'; return; }
    box.innerHTML = hits.slice(0, 80).map(hit =>
      '<div class="search-row" data-sid="' + h(hit.sp.id) + '" data-iid="' + h(hit.it.id) + '">' +
      '<span class="s-tag">' + h(hit.sp.name) + '</span>' +
      '<span class="s-name">' + h(hit.it.name) + (hit.it.qty ? ' ×' + hit.it.qty : '') + '</span>' +
      '<span class="s-tag">' + h(hit.it.cat) + '</span>' +
      '<span class="s-note">' + h(hit.it.note || '') + '</span></div>').join('');
    box.querySelectorAll('.search-row').forEach(row => {
      row.addEventListener('click', () => {
        const sid = row.dataset.sid, iid = row.dataset.iid;
        closeModal();
        selectedId = sid;
        renderSidebar();
        renderMain();
        const target = document.querySelector('.item-row[data-id="' + iid + '"]');
        if (target) {
          target.scrollIntoView({ block: 'center', behavior: 'smooth' });
          target.classList.add('flash');
          setTimeout(() => target.classList.remove('flash'), 2000);
        }
      });
    });
  }
  renderResults('');
  input.addEventListener('input', () => renderResults(input.value));
  setTimeout(() => input.focus(), 60);
}

/* ---------- 分类管理（增删改，改名自动同步项目） ---------- */
function openCatManageModal() {
  const mask = openModal('🗂 分类管理',
    '<div id="cmRows"></div><button class="btn" id="cmAdd" style="margin-top:4px">＋ 新增分类</button>' +
    '<div style="color:#9ca3af;font-size:12px;margin-top:10px">删除分类时，其中的项目会移到「其他」（若无「其他」则移到第一个分类）；重命名会自动更新所有项目。</div>',
    '<button class="btn primary" id="cmDone">完成</button>');
  const body = mask.querySelector('#cmRows');
  function applyChanges() {
    rebuildCats();
    save();
    renderStats();
    renderSidebar();
    renderMain();
    refreshCounts();
  }
  function renderRows() {
    body.innerHTML = state.cats.map((c, i) =>
      '<div class="cat-manage-row" data-i="' + i + '">' +
      '<select class="cm-icon" title="图标">' + CAT_ICON_CHOICES.map(ic =>
        '<option value="' + ic + '"' + (ic === c.icon ? ' selected' : '') + '>' + ic + '</option>').join('') + '</select>' +
      '<input type="text" class="cm-name" value="' + h(c.name) + '" placeholder="分类名称">' +
      '<input type="color" class="cm-color" value="' + c.color + '" title="颜色">' +
      '<button class="cat-manage-del" data-i="' + i + '">删除</button>' +
      '</div>').join('');
    body.querySelectorAll('.cat-manage-row').forEach(row => {
      const i = Number(row.dataset.i);
      row.querySelector('.cm-icon').addEventListener('change', e => { state.cats[i].icon = e.target.value; applyChanges(); });
      row.querySelector('.cm-color').addEventListener('input', e => { state.cats[i].color = e.target.value; applyChanges(); });
      row.querySelector('.cm-name').addEventListener('input', e => renameCat(i, e.target.value));
      row.querySelector('.cat-manage-del').addEventListener('click', () => deleteCat(i));
    });
  }
  function renameCat(i, newName) {
    const old = state.cats[i].name;
    const trimmed = String(newName || '').trim();
    if (!trimmed || trimmed === old) return;
    if (state.cats.some((c, j) => j !== i && c.name === trimmed)) { toast('已存在同名分类「' + trimmed + '」'); return; }
    state.cats[i].name = trimmed;
    for (const sp of state.spaces) for (const it of sp.items) if (it.cat === old) it.cat = trimmed;
    CATS[i] = trimmed;
    applyChanges();
    mask.querySelector('.modal-head h3').textContent = '🗂 分类管理';
  }
  function deleteCat(i) {
    if (state.cats.length <= 1) { toast('至少保留一个分类'); return; }
    const c = state.cats[i];
    const count = state.spaces.reduce((a, sp) => a + sp.items.filter(it => it.cat === c.name).length, 0);
    const fallbackName = state.cats.some(x => x.name === '其他') && x_name_is_not(i) ? '其他' : state.cats.filter((_, j) => j !== i)[0].name;
    if (!confirm('删除分类「' + c.name + '」？' + (count ? '其中 ' + count + ' 个项目将移到「' + fallbackName + '」。' : ''))) return;
    const snap = takeSnapshot();
    state.cats.splice(i, 1);
    for (const sp of state.spaces) for (const it of sp.items) if (it.cat === c.name) it.cat = fallbackName;
    applyChanges();
    renderRows();
    toast('已删除分类「' + c.name + '」', '撤销', () => undoIfCurrent(snap));
  }
  function x_name_is_not(i) { return state.cats[i].name !== '其他'; }
  renderRows();
  /* 只绑定一次：renderRows 只重建行内容，避免 #cmAdd 监听器叠加导致一次点击新增多个分类 */
  mask.querySelector('#cmAdd').addEventListener('click', () => {
    state.cats.push({ name: '新分类' + (state.cats.length > 5 ? state.cats.length - 4 : ''), icon: '📦', color: CAT_COLOR_CHOICES[state.cats.length % CAT_COLOR_CHOICES.length] });
    applyChanges();
    renderRows();
  });
  mask.querySelector('#cmDone').addEventListener('click', closeModal);
}

/* ---------- 从其他空间复制项目 ---------- */
function openCopyItemsModal() {
  const target = state.spaces.find(s => s.id === selectedId);
  if (!target) return;
  const others = state.spaces.filter(s => s.id !== target.id);
  if (!others.length) { toast('当前只有一个空间，无法复制'); return; }
  const mask = openModal('⇩ 从其他空间复制项目 → ' + target.name,
    '<div style="margin-bottom:10px">来源空间：<select id="cisSource">' +
    others.map(s => '<option value="' + h(s.id) + '">' + h(s.name) + '</option>').join('') + '</select>' +
    '<label style="margin-left:12px;font-size:13px"><input type="checkbox" id="cisSkipDup" checked> 跳过当前空间已有的同名项目</label></div>' +
    '<div id="cisCats"></div>',
    '<button class="btn primary" id="cisGo">复制</button>');
  const sel = mask.querySelector('#cisSource');
  const catsBox = mask.querySelector('#cisCats');
  function renderCats() {
    const src = others.find(s => s.id === sel.value);
    catsBox.innerHTML = CATS.map(cat => {
      const n = src.items.filter(i => i.cat === cat).length;
      return '<label style="display:inline-flex;align-items:center;gap:5px;margin:4px 12px 4px 0;font-size:13px">' +
        '<input type="checkbox" class="cis-cat" value="' + h(cat) + '" ' + (n ? 'checked' : 'disabled') + '> ' +
        h(cat) + '（' + n + ' 项）</label>';
    }).join('');
  }
  renderCats();
  sel.addEventListener('change', renderCats);
  mask.querySelector('#cisGo').addEventListener('click', () => {
    const src = others.find(s => s.id === sel.value);
    const chosen = new Set(Array.from(mask.querySelectorAll('.cis-cat:checked')).map(cb => cb.value));
    const skipDup = mask.querySelector('#cisSkipDup').checked;
    const existing = new Set(target.items.filter(i => chosen.has(i.cat)).map(i => i.name));
    const snap = takeSnapshot();
    let copied = 0;
    for (const it of src.items) {
      if (!chosen.has(it.cat) || !it.name) continue;
      if (skipDup && existing.has(it.name)) continue;
      target.items.push({ id: uid(), cat: it.cat, name: it.name, qty: it.qty, unit: it.unit, note: it.note });
      existing.add(it.name);
      copied++;
    }
    if (!copied) { toast('没有可复制的项目'); return; }
    save();
    renderMain();
    refreshCounts();
    toast('✅ 已复制 ' + copied + ' 个项目', '撤销', () => undoIfCurrent(snap));
    closeModal();
  });
}

/* ---------- 复制整个空间 ---------- */
function cloneSpace() {
  const sp = state.spaces.find(s => s.id === selectedId);
  if (!sp) return;
  takeSnapshot();
  const copy = deepClone(sp);
  copy.id = uid();
  copy.name = sp.name + ' 副本';
  copy.items.forEach(i => { i.id = uid(); });
  state.spaces.splice(state.spaces.indexOf(sp) + 1, 0, copy);
  selectedId = copy.id;
  save();
  renderAll();
  toast('✅ 已复制空间「' + sp.name + '」', '撤销', () => undoIfCurrent(snap));
}

/* ---------- 拖拽排序（侧栏空间 + 分类内项目） ---------- */
function initSidebarDrag() {
  const ul = document.getElementById('spaceList');
  let dragId = null;
  ul.addEventListener('dragstart', e => {
    const li = e.target.closest('li');
    if (!li) return;
    dragId = li.dataset.id;
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
  });
  ul.addEventListener('dragover', e => {
    const li = e.target.closest('li');
    if (!li || !dragId || li.dataset.id === dragId) return;
    e.preventDefault();
    document.querySelectorAll('#spaceList li').forEach(x => x.classList.remove('drag-over'));
    li.classList.add('drag-over');
  });
  ul.addEventListener('drop', e => {
    const li = e.target.closest('li');
    document.querySelectorAll('#spaceList li').forEach(x => x.classList.remove('drag-over'));
    if (!li || !dragId || li.dataset.id === dragId) return;
    e.preventDefault();
    const from = state.spaces.findIndex(s => s.id === dragId);
    const to = state.spaces.findIndex(s => s.id === li.dataset.id);
    if (from < 0 || to < 0 || from === to) return;
    const moved = state.spaces.splice(from, 1)[0];
    state.spaces.splice(from < to ? to - 1 : to, 0, moved);
    save();
    renderSidebar();
    dragId = null;
  });
  ul.addEventListener('dragend', () => {
    dragId = null;
    document.querySelectorAll('#spaceList li').forEach(x => x.classList.remove('drag-over'));
  });
}
function initItemDrag() {
  const main = document.getElementById('mainArea');
  let dragging = null;
  main.addEventListener('mousedown', e => {
    if (!e.target.classList.contains('i-handle')) return;
    const row = e.target.closest('.item-row');
    if (row) row.draggable = true;
  });
  main.addEventListener('mouseup', e => {
    const row = e.target.closest('.item-row');
    if (row) row.draggable = false;
  });
  main.addEventListener('dragstart', e => {
    const row = e.target.closest('.item-row');
    if (!row) return;
    dragging = row.dataset.id;
    row.classList.add('drag-src');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragging); } catch (err) {}
  });
  main.addEventListener('dragend', e => {
    document.querySelectorAll('.item-row').forEach(r => { r.classList.remove('drag-src'); r.draggable = false; });
    document.querySelectorAll('.item-row.drag-over').forEach(r => r.classList.remove('drag-over'));
    dragging = null;
  });
  main.addEventListener('dragover', e => {
    if (!dragging) return;
    const row = e.target.closest('.item-row');
    if (!row || row.dataset.id === dragging) return;
    const srcRow = document.querySelector('.item-row[data-id="' + dragging + '"]');
    if (!srcRow || srcRow.closest('.rows') !== row.closest('.rows')) return; // 仅同分类内排序
    e.preventDefault();
    document.querySelectorAll('.item-row.drag-over').forEach(r => r.classList.remove('drag-over'));
    row.classList.add('drag-over');
  });
  main.addEventListener('drop', e => {
    if (!dragging) return;
    const row = e.target.closest('.item-row');
    if (!row) return;
    e.preventDefault();
    const sp = state.spaces.find(s => s.id === selectedId);
    if (!sp) return;
    const from = sp.items.findIndex(i => i.id === dragging);
    const to = sp.items.findIndex(i => i.id === row.dataset.id);
    if (from < 0 || to < 0 || from === to) return;
    const moved = sp.items.splice(from, 1)[0];
    sp.items.splice(from < to ? to - 1 : to, 0, moved);
    save();
    const card = row.closest('.cat-card');
    renderCategoryRows(sp, card.dataset.cat, card.querySelector('.rows'));
    updateAllNames();
    dragging = null;
  });
}

function initApp() {
  /* ---- 移动端菜单开关 ---- */
  const topbar = document.querySelector('.topbar');
  document.getElementById('menuToggle').addEventListener('click', () => topbar.classList.toggle('menu-open'));
  topbar.querySelector('.actions').addEventListener('click', (e) => {
    if (e.target.closest('button')) topbar.classList.remove('menu-open');
  });

  /* ---- 云同步面板 ---- */
  initSyncPanel();

  /* ---- 主区 ---- */
  const main = document.getElementById('mainArea');

  main.addEventListener('input', (e) => {
    const sp = state.spaces.find(s => s.id === selectedId);
    if (!sp) return;
    const t = e.target;
    if (t.classList.contains('space-name-input')) {
      sp.name = t.value;
      save();
      const li = document.querySelector('#spaceList li[data-id="' + sp.id + '"] .s-name');
      if (li) li.textContent = sp.name || '未命名';
      main.querySelector('.note-card h3').textContent = '📝 单独备注（' + (sp.name || '未命名') + '）';
      refreshCounts();
    } else if (t.classList.contains('space-note')) {
      sp.note = t.value;
      save();
    } else {
      const row = t.closest('.item-row');
      if (!row) return;
      const it = sp.items.find(i => i.id === row.dataset.id);
      if (!it) return;
      if (t.classList.contains('i-name')) { it.name = t.value; updateAllNames(); }
      else if (t.classList.contains('i-qty')) {
        const n = parseInt(t.value, 10);
        it.qty = (t.value === '' || isNaN(n) || n < 1) ? null : Math.min(n, 999);
        if (it.qty != null && t.value !== String(it.qty)) t.value = String(it.qty);
      } else if (t.classList.contains('i-unit')) it.unit = t.value;
      else if (t.classList.contains('i-note')) it.note = t.value;
      save();
      refreshCounts();
      updateCatBadges(sp);
    }
  });

  main.addEventListener('click', (e) => {
    const sp = state.spaces.find(s => s.id === selectedId);
    if (!sp) return;
    if (e.target.id === 'btnDelSpace') {
      if (confirm('确定删除空间「' + sp.name + '」及其全部点位吗？')) {
        const snap = takeSnapshot();
        const idx = state.spaces.indexOf(sp);
        state.spaces = state.spaces.filter(s => s.id !== sp.id);
        selectedId = state.spaces.length ? state.spaces[Math.min(idx, state.spaces.length - 1)].id : null;
        save(); renderAll();
        toast('已删除空间「' + sp.name + '」', '撤销', () => undoIfCurrent(snap));
      }
      return;
    }
    if (e.target.id === 'btnManageCats') { openCatManageModal(); return; }
    if (e.target.id === 'btnCopyFrom') { openCopyItemsModal(); return; }
    if (e.target.id === 'btnCloneSpace') { cloneSpace(); return; }
    if (e.target.classList.contains('add')) {
      const card = e.target.closest('.cat-card');
      const cat = card.dataset.cat;
      const it = { id: uid(), cat, name: '', qty: null, unit: '', note: '' };
      sp.items.push(it);
      save();
      renderCategoryRows(sp, cat, card.querySelector('.rows'));
      updateCatBadges(sp);
      refreshCounts();
      const lastRow = card.querySelector('.rows .item-row:last-child .i-name');
      if (lastRow) lastRow.focus();
      return;
    }
    if (e.target.classList.contains('i-del')) {
      const row = e.target.closest('.item-row');
      const it = sp.items.find(i => i.id === row.dataset.id);
      if (!it) return;
      const snap = takeSnapshot();
      sp.items = sp.items.filter(i => i.id !== row.dataset.id);
      save();
      renderCategoryRows(sp, it.cat, row.closest('.rows'));
      updateCatBadges(sp);
      refreshCounts();
      toast('已删除「' + (it.name || '未命名项目') + '」', '撤销', () => undoIfCurrent(snap));
    }
  });

  /* ---- 侧栏 ---- */
  document.getElementById('btnAddSpace').addEventListener('click', () => {
    const sp = { id: uid(), name: '新空间', note: '', items: [] };
    state.spaces.push(sp);
    selectedId = sp.id;
    save(); renderAll();
    const nameI = document.querySelector('.space-name-input');
    if (nameI) { nameI.focus(); nameI.select(); }
  });

  /* ---- 全局备注 ---- */
  const gnInput = document.getElementById('gnInput');
  function addGlobalNote() {
    const text = gnInput.value.trim();
    if (!text) { gnInput.focus(); return; }
    state.globalNotes.push({ id: uid(), text });
    gnInput.value = '';
    save(); renderGlobalNotes();
  }
  document.getElementById('gnAddBtn').addEventListener('click', addGlobalNote);
  gnInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addGlobalNote(); });
  const gnList = document.getElementById('gnList');
  gnList.addEventListener('input', (e) => {
    if (!e.target.classList.contains('gn-text')) return;
    const li = e.target.closest('li');
    const g = state.globalNotes.find(x => x.id === li.dataset.id);
    if (g) { g.text = e.target.value; save(); }
  });
  gnList.addEventListener('click', (e) => {
    if (!e.target.classList.contains('gn-del')) return;
    const li = e.target.closest('li');
    const removed = state.globalNotes.find(x => x.id === li.dataset.id);
    const snap = takeSnapshot();
    state.globalNotes = state.globalNotes.filter(x => x.id !== li.dataset.id);
    save(); renderGlobalNotes();
    if (removed) toast('已删除备注「' + (removed.text || '').slice(0, 20) + '…」', '撤销', () => undoIfCurrent(snap));
  });

  /* ---- 顶栏动作 ---- */
  document.getElementById('btnExport').addEventListener('click', exportExcel);
  document.getElementById('btnSummary').addEventListener('click', openSummaryModal);
  document.getElementById('btnSearch').addEventListener('click', openSearchModal);
  document.getElementById('btnBackup').addEventListener('click', exportJSON);
  document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileImport').click());
  document.getElementById('fileImport').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const s = migrateState(JSON.parse(reader.result));
        if (!s || !Array.isArray(s.spaces)) throw new Error('bad');
        const snap = takeSnapshot();
        state = s;
        rebuildCats();
        selectedId = state.spaces.length ? state.spaces[0].id : null;
        save(); renderAll();
        toast('✅ 已导入备份（' + state.spaces.length + ' 个空间）', '撤销', () => undoIfCurrent(snap));
      } catch (err) {
        toast('❌ 导入失败：文件格式不正确');
      }
    };
    reader.readAsText(f, 'utf-8');
    e.target.value = '';
  });
  document.getElementById('btnReset').addEventListener('click', () => {
    if (confirm('确定恢复为《全屋智能表格.xlsx》的初始数据吗？\n当前所有修改将被覆盖（建议先「备份 JSON」）。')) {
      const snap = takeSnapshot();
      state = migrateState(deepClone(SEED_DATA));
      rebuildCats();
      selectedId = state.spaces.length ? state.spaces[0].id : null;
      save(); renderAll();
      toast('已恢复初始数据', '撤销', () => undoIfCurrent(snap));
    }
  });

  initSidebarDrag();
  initItemDrag();
  let autoPrintModal = false;
  window.addEventListener('beforeprint', () => {
    autoPrintModal = !document.getElementById('modalMask');
    if (autoPrintModal) openSummaryModal();
  });
  window.addEventListener('afterprint', () => {
    if (autoPrintModal) { closeModal(); autoPrintModal = false; }
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  renderAll();
  if (syncCfg && syncCfg.token && syncCfg.gistId) syncCheck(false);
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp);
  else initApp();
}
</script>
</body>
</html>
